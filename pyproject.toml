    "msoffcrypto-tool==5.4.2",
    "numpy==2.2.6",
    "openpyxl==3.1.5",
    "pandas==2.3.2",
    "pillow==11.3.0",
    "protobuf",
    "pypdfium2==5.13.0",
    "python-docx==1.1.2",
    "python-dotenv==1.1.1",
    "python-pptx==1.0.2",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.1.0",
    "sentencepiece",
    "streamlit==1.64.0",
    "sudachidict-core==20250515",
